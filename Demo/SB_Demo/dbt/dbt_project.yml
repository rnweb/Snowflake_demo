# ============================================================================
# Session 1 — dbt project: Superintendency of Banks demo
# ============================================================================
# Layers:
#   STAGING_SCHEMA      views  (stg_*)   — light cleaning of raw Spanish tables
#   CORE_BANKING_SCHEMA tables —         — approved mart names (CLIENT_PROFILE_DIM,
#                                          CREDIT_CARD_TRANSACTIONS)
# Role guardrail: role is pinned in profiles.yml (FR_DATA_ENGINEER).
# ============================================================================

name: superintendency_demo
version: "1.0.0"
config-version: 2
profile: superintendency_demo

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  superintendency_demo:
    staging:
      # Views: no storage, so no Fail-safe cost. Transient does not apply.
      +materialized: view
      +schema: STAGING_SCHEMA
    core:
      +materialized: table
      +schema: CORE_BANKING_SCHEMA
      # Transient: no 7-day Fail-safe storage. These marts are rebuilt from raw,
      # so Fail-safe adds cost without recovery value. Time Travel still applies.
      # Note: a transient table cannot be cloned into a permanent one (002120).
      +transient: true
    # C05 CI/CD artifact. Views only: they never replace the governed core
    # tables (CREATE OR REPLACE TABLE would drop the Terraform-attached
    # masking policies) and they keep RLS, which is evaluated for the caller.
    analytics:
      +materialized: view
      +schema: RISK_ANALYTICS_SCHEMA
      +tags: ["cicd"]
